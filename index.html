<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Cumpleaños de Lotti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="shortcut icon"
      href="balloons.png"
      type="image/x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Chewy&family=Quicksand:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="invitation-container">
      <!-- SECCIÓN HEADER -->
      <section class="header-section">
        <h1 class="birthday-title">¡Lotti cumple años!</h1>
        <p class="header-text">
          Te invita a celebrar su cumpleaños nº 8 👇
        </p>
      </section>

      <!-- SECCIÓN IMAGEN -->
      <section class="image-section">
        <img
          src="siames_asset.png"
          alt="Cumpleaños de Lotti"
          class="birthday-image"
        />
        <p class="image-text">
          Sábado 10 de Enero<br />
          De 16:00 a 20:00 hs
        </p>
      </section>

      <!-- DIVISOR ONDULADO SUPERIOR -->
      <div class="wave-divider wave-divider-top">
        <svg viewBox="0 0 1200 40" preserveAspectRatio="none">
          <path
            d="M0,0 L1200,0 L1200,20 Q900,40 600,20 T0,20 Z"
            fill="#ffffff"
          />
        </svg>
      </div>

      <!-- SECCIÓN UBICACIÓN -->
      <section class="location-section">
        <h2 class="location-title">📍 ¿Dónde?</h2>
        <p class="location-address">
          Sarmiento 360, entre calles Conesa y Colón; Quilmes <br />
          Piso n°14 - SUM
        </p>
        <a
          href="https://maps.app.goo.gl/wFr2g9bg7nPz3uSV6"
          class="btn btn-maps"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg class="icon" viewBox="0 0 24 24">
            <path
              d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
            />
          </svg>
          Ver en Google Maps
        </a>
      </section>

      <!-- DIVISOR ONDULADO INFERIOR -->
      <div class="wave-divider wave-divider-bottom">
        <svg viewBox="0 0 1200 40" preserveAspectRatio="none">
          <path
            d="M0,20 Q300,0 600,20 T1200,20 L1200,0 L0,0 Z"
            fill="#d35b83"
          />
        </svg>
      </div>

      <!-- SECCIÓN WHATSAPP -->
      <section class="whatsapp-section">
        <h2 class="whatsapp-title">¡Confirmá tu asistencia!</h2>
        <a href="#" class="btn btn-whatsapp" id="btnWhatsapp">
          <svg class="icon" viewBox="0 0 24 24">
            <path
              d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"
            />
          </svg>
          Mamá de Lotti
        </a>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
